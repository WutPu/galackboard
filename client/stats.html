<template name="stats">
    <div id="stats">
        <h2>Statistics</h2>
        <p>Puzzles unlocked: {{numUnlockedPuzzles}}</p>
        <p>Puzzles solved: {{numSolvedPuzzles}}</p>
        <p>Metas unlocked: {{numMetas}}</p>
        <p>Metas solved: {{numSolvedMetas}}</p>
        

        <h2>Priority List</h2>
        <p>{{{prioList}}}</p>
    </div>
</template>
